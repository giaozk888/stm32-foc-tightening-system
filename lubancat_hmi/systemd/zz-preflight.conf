# Read-only preflight observation UI; supersedes zz-browser.conf without
# changing CAN setup, STM32 firmware, or the existing SQLite/export paths.
[Service]
WorkingDirectory=/home/cat/lubancat_hmi_snapshot
Environment=LUBANCAT_HMI_RECORD_DB=/home/cat/lubancat_hmi_snapshot/records/telemetry.sqlite3
Environment=LUBANCAT_HMI_EXPORT_DIR=/home/cat/lubancat_hmi_snapshot/exports
ExecStart=
ExecStart=/usr/bin/openvt -f -c 1 -s -w -- /home/cat/lubancat_hmi_snapshot/build_preflight/lubancat_hmi
