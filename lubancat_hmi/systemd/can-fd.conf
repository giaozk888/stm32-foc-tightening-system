# Deployment template only. Do not install before the FD device tree,
# matching STM32 firmware, serial recovery, and two-node isolation are verified.
[Unit]
Description=LubanCat isolated read-only CAN FD at 500k without BRS

[Service]
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/libexec/lubancat-canfd-setup.py --apply
