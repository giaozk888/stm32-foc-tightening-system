# Read-only Pigweed log receiver; inherits proven EGLFS/openvt and CAN setup.
# No log port is guessed. A separate override can select a verified USB device.
[Service]
WorkingDirectory=/home/cat/lubancat_hmi_pigweed_20260930/lubancat_hmi
Environment=LUBANCAT_HMI_RECORD_DB=/home/cat/lubancat_hmi_snapshot/records/telemetry.sqlite3
Environment=LUBANCAT_HMI_EXPORT_DIR=/home/cat/lubancat_hmi_snapshot/exports
Environment=LUBANCAT_HMI_LOG_PORT=
Environment=LUBANCAT_HMI_LOG_EXPORT_DIR=/home/cat/lubancat_hmi_pigweed_20260930/logs
ExecStart=
ExecStart=/usr/bin/openvt -f -c 1 -s -w -- /home/cat/lubancat_hmi_pigweed_20260930/build/lubancat_hmi --page 7
