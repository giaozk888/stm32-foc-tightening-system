# Safe control-protocol preview: no CAN writes and no enabled motor commands.
# Original build_preflight service and its drop-in remain available for rollback.
[Service]
WorkingDirectory=/home/cat/lubancat_hmi_control_locked
Environment=LUBANCAT_HMI_RECORD_DB=/home/cat/lubancat_hmi_snapshot/records/telemetry.sqlite3
Environment=LUBANCAT_HMI_EXPORT_DIR=/home/cat/lubancat_hmi_snapshot/exports
ExecStart=
ExecStart=/usr/bin/openvt -f -c 1 -s -w -- /home/cat/lubancat_hmi_control_locked/build/lubancat_hmi
