limit_req_zone $binary_remote_addr zone=tightening_ip_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=tightening_ip_connections:10m;

server {
    listen 80 default_server;
    server_name 118.25.40.152;
    access_log off;
    server_tokens off;
    client_max_body_size 2k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    if ($host != "118.25.40.152") { return 444; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tightening-acme;
        default_type text/plain;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 308 https://118.25.40.152$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name 118.25.40.152;
    ssl_certificate /etc/letsencrypt/live/tightening-public-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tightening-public-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tightening_ip_tls:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    access_log off;
    server_tokens off;
    client_max_body_size 2k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    limit_req zone=tightening_ip_requests burst=20 nodelay;
    limit_req_status 429;
    limit_conn tightening_ip_connections 20;
    limit_conn_status 429;
    if ($host != "118.25.40.152") { return 444; }
    location / {
        # Public entry is READ ONLY; uploading still uses the existing SSH tunnel.
        # GET also permits HEAD in Nginx. Bearer auth remains enforced upstream.
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18088;
        proxy_http_version 1.1;
        proxy_set_header Host 118.25.40.152;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 10s;
        proxy_cache off;
    }
}
