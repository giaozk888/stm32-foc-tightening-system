# HTTP serves ACME challenges ONLY. No app, proxy or API token on HTTP.
server {
    listen 80 default_server;
    server_name 118.25.40.152;
    access_log off;
    server_tokens off;
    client_max_body_size 2k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    if ($host != "118.25.40.152") { return 444; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tightening-acme;
        default_type text/plain;
        limit_except GET { deny all; }
        try_files $uri =404;
    }
    location / { return 404; }
}
